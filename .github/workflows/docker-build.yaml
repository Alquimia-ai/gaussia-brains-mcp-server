name: Docker build, scan & push

permissions: {}

on:
  push:
    branches: [main, develop]
  release:
    types: [published]

jobs:
  build-and-push:
    name: Build & push gaussia-brains-mcp-server Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout gaussia-brains-mcp-server
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Set image tag based on branch or release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
            echo "TAGS=${VERSION}" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "TAGS=latest" >> "$GITHUB_ENV"
          else
            echo "TAGS=dev" >> "$GITHUB_ENV"
          fi

      # All dependencies are public (no [tool.uv.sources]), so no PAT is needed.
      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run tests
        run: uv run pytest tests -v

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          no-cache: true
          sbom: true
          provenance: mode=max
          platforms: ${{ vars.BUILD_PLATFORM }}
          tags: ${{ vars.IMAGE_REGISTRY }}/alquimiaai/gaussia-brains-mcp-server:${{ env.TAGS }}

      - name: Sign container image with cosign
        env:
          IMAGE_NAME: ${{ vars.IMAGE_REGISTRY }}/alquimiaai/gaussia-brains-mcp-server
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Keyless signing via GitHub Actions OIDC. The signature is published
          # to the registry (Sigstore/OCI) alongside the image.
          cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"

      # Scans the exact digest that was pushed and signed. Fails the job on
      # critical vulnerabilities that have a fix available; the full report
      # (all severities) is printed to the log.
      - name: Scan image with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          image: ${{ vars.IMAGE_REGISTRY }}/alquimiaai/gaussia-brains-mcp-server@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table
