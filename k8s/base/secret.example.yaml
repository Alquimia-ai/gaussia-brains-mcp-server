# Not part of the base. Create it (ideally via ExternalSecret / Sealed Secret) when the registry
# needs credentials, the embeddings endpoint needs a key, or signatures are verified with a key.
# Registry credentials are held here, server-side: clients never see them. The writer replica
# pushes, so they need push rights on the brains namespace (and its index repository).
apiVersion: v1
kind: Secret
metadata:
  name: gaussia-brains-mcp-server
type: Opaque
stringData:
  GBMS_REGISTRY_USERNAME: brains-publisher
  GBMS_REGISTRY_PASSWORD: replace-me
  # GBMS_EMBEDDINGS_API_KEY: replace-me
  # GBMS_COSIGN_KEY: /keys/cosign.pub
