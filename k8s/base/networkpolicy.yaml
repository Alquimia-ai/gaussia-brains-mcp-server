# Ingress from the runtime (MCP), Studio (catalog) and Ledger (lifecycle REST), nothing else.
# Adjust the selectors to the namespaces they run in; if Ledger reaches the service through an
# ingress controller, allow that namespace too. Egress is left open: oras must reach the OCI
# registry, and the issuer's JWKS and the embeddings endpoint must be reachable.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gaussia-brains-mcp-server
spec:
  # Writer and read replicas both carry this label.
  podSelector:
    matchLabels:
      alquimia.ai/component: brains-mcp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: alquimia
      ports:
        - { port: http }
