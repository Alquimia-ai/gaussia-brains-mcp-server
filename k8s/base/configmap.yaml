# Every setting is a GBMS_* variable (src/gaussia_brains_mcp_server/config.py). Lists are JSON.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gaussia-brains-mcp-server
data:
  GBMS_LOG_LEVEL: INFO
  GBMS_PORT: "8000"
  GBMS_MCP_PATH: /mcp
  # Where brains may come from. Empty fails closed.
  GBMS_CATALOG_NAMESPACES: '["registry.alquimia.ai/brains"]'
  GBMS_ALLOWED_SOURCES: '["registry.alquimia.ai/brains"]'
  GBMS_REGISTRY_DEFAULT: registry.alquimia.ai
  GBMS_REGISTRY_NAMESPACE_BRAINS: brains
  GBMS_CACHE_MAX_BRAINS: "4"
  # Signing and governance are out of scope for now: publisher signatures off, and new brains
  # are ungoverned, so unsigned snapshots are served with a warning (decision D10).
  # off | warn | required
  GBMS_SIGNATURE_POLICY: "off"
  GBMS_VERIFY_UNSIGNED: warn
  # GBMS_STORE_ROOT (the working store) is set on the writer Deployment only, not here: this
  # ConfigMap is shared with the read replicas, which must run without it.
  # Writes are attributed to the token's human: this claim when it is an address, else
  # <GBMS_ACTOR_NAMESPACE or issuer host>/<sub>.
  GBMS_ACTOR_CLAIM: email
  # Semantic search: an OpenAI-compatible /v1/embeddings endpoint. Unset = structural indices only.
  # GBMS_EMBEDDINGS_URL: http://vllm-embeddings.ai.svc.cluster.local:8000/v1
  # GBMS_EMBEDDINGS_MODEL: text-embedding-3-small
  # GBMS_EMBEDDINGS_MODEL_TAG: openai/text-embedding-3-small
  # OAuth resource server: the audience tokens are issued for, and the issuers trusted.
  # Writer and read replicas share one GBMS_AUTH_RESOURCE: they are one logical resource.
  GBMS_AUTH_ENABLED: "true"
  GBMS_AUTH_RESOURCE: http://gaussia-brains-mcp-server.brains.svc.cluster.local:8000
  # REQUIRED IN AN OVERLAY. '[]' is a placeholder, not a working value: with auth enabled and no
  # issuer every token is rejected, and the server refuses to start (Settings.raise_for_startup)
  # unless GBMS_ALLOW_INSECURE_DEV=true. Set the issuer list, e.g.:
  # Keycloak (platform bundle): realm roles map to scopes. Ledger users need brain-writer.
  #   GBMS_AUTH_ISSUERS: |
  #   [{"issuer": "https://sso.example.com/realms/alquimia",
  #     "claims": {"roles": ["realm_access.roles"]},
  #     "role_scopes": {"brain-reader":    ["brains:read"],
  #                     "brain-catalog":   ["brains:catalog"],
  #                     "brain-publisher": ["brains:publish"],
  #                     "brain-writer":    ["brains:write", "brains:catalog", "brains:read"]}}]
  GBMS_AUTH_ISSUERS: '[]'
