apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: gaussia-brains-mcp-server
      app.kubernetes.io/part-of: alquimia
    includeSelectors: false
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - deployment-read.yaml
  - service-read.yaml
  - networkpolicy.yaml
# Set to the image built from ../Dockerfile and pushed to your registry (e.g. ECR), pinned.
images:
  - name: gaussia-brains-mcp-server
    newName: registry.example.com/gaussia-brains-mcp-server
    newTag: "0.1.0"
