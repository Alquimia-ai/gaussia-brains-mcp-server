apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaussia-brains-mcp-server
spec:
  # The writer replica: it owns the working-store volume (ReadWriteOnce), so exactly one runs
  # and an update replaces it rather than rolling a second one in beside it. Scale reads with a
  # separate Deployment that leaves GBMS_STORE_ROOT unset (MCP, discovery and search only).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gaussia-brains-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gaussia-brains-mcp-server
        alquimia.ai/component: brains-mcp
    spec:
      serviceAccountName: gaussia-brains-mcp-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: gaussia-brains-mcp-server
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: gaussia-brains-mcp-server }
            # Optional: GBMS_REGISTRY_USERNAME / GBMS_REGISTRY_PASSWORD (push rights: this
            # replica publishes brains) / GBMS_EMBEDDINGS_API_KEY / GBMS_COSIGN_KEY.
            - secretRef: { name: gaussia-brains-mcp-server, optional: true }
          env:
            - { name: HOME, value: /tmp }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            # Roughly 8 KiB of heap per block, times GBMS_CACHE_MAX_BRAINS loaded brains, plus
            # GBMS_STORE_MAX_READ_HANDLES open handles per working-store brain being browsed.
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # oras pulls into temporary directories.
            - { name: tmp, mountPath: /tmp }
            # The working store (GBMS_STORE_ROOT=/var/lib/gbms/brains).
            - { name: store, mountPath: /var/lib/gbms }
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: store
          persistentVolumeClaim: { claimName: gaussia-brains-mcp-server-store }
